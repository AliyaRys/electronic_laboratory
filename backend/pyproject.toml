[project]
name = "vse-lab-backend"
version = "0.1.0"
description = "Электронная лаборатория ВСЭ — FastAPI backend (meat MVP for veterinary laboratories)"
authors = [{ name = "VSE Lab" }]
license = { text = "MIT" }
requires-python = ">=3.15,<3.16"
dependencies = [
    "alembic>=1.16.4",
    "argon2-cffi==25.1.0",
    "arq==0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.115.8",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "psycopg[binary]==3.3.8",
    "pycasbin>=2.0.0,<3",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.7.1",
    "redis>=5.2.1,<6",
    "sqlalchemy>=2.0.37",
    "sqlalchemy-adapter==1.9.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "pytest-cov==7.1.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.15.12",
    "testcontainers[postgres]>=4.10.0",
    "pywin32>=312; sys_platform == 'win32'",
]
