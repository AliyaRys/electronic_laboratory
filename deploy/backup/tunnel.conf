Host vse-backup-tunnel
    HostName backup.example.invalid
    User vsebackup-tunnel
    IdentityFile /tmp/tunnel-key
    IdentitiesOnly yes
    BatchMode yes
    StrictHostKeyChecking yes
    UserKnownHostsFile /tmp/known-hosts
    HostKeyAlias vse-backup
    ExitOnForwardFailure yes
    ServerAliveInterval 15
    ServerAliveCountMax 3
    RemoteForward 127.0.0.1:6543 postgres:5432
    RequestTTY no
    SessionType none
