# External edge nginx (trusted proxy, OPS-01): terminates TLS 1.2/1.3 only and
# forwards plain HTTP to the SPA nginx on the closed internal network.
#
# Certificates/keys are closed host files referenced by path — their contents
# never live in Git, images or logs. Real hostnames are installation values and
# must not be written here; <INSTALL_FQDN> is substituted by the operator's
# closed env-file, never by CI evidence.
#
# The SPA nginx (deploy/nginx.conf) stays the single origin: /api/v1 continues
# to pass through to the backend unchanged, /openapi.json stays backend's.

server {
    listen 443 ssl;
    server_name <INSTALL_FQDN>;

    # TLS 1.2/1.3 only (OPS-01). Termination happens here, at the external
    # nginx / trusted proxy, and nowhere else in the stack.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_certificate     /etc/vse/tls/install.crt;
    ssl_certificate_key /etc/vse/tls/install.key;

    # HSTS: the origin is HTTPS-only.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}

server {
    # Plain HTTP answers only with the redirect to HTTPS; never serves content.
    listen 80;
    server_name <INSTALL_FQDN>;
    return 301 https://$host$request_uri;
}
