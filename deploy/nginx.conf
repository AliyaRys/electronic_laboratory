# Frontend nginx: single origin, /api/ proxied to the backend WITHOUT URI rewrite
# (ADR-013). A trailing-slash proxy_pass that strips the prefix is forbidden;
# /api/v1 belongs to the backend. BACKEND_HOST/BACKEND_PORT are substituted at
# container start; envsubst is limited to these names to avoid clobbering $uri.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API traffic: forward the path verbatim (do not remove /api/v1).
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        # Preserve the browser-visible port (for example 127.0.0.1:8080), so
        # the backend's strict same-origin CSRF check sees the real origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The OpenAPI document is served by the backend, not the SPA fallback.
    location = /openapi.json {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_set_header Host $http_host;
    }

    # Static assets.
    location /assets/ {
        try_files $uri =404;
    }

    # SPA fallback for all non-API routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
