# TLS front for the private registry (ADR-024). Terminates TLS 1.2/1.3 only,
# requires basic auth (htpasswd, closed host file) and forwards to the
# registry daemon on the dedicated internal network. No content is served
# without a verified client credential.

server {
    listen 443 ssl;
    server_name _;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_certificate     /etc/vse/registry/tls/registry.crt;
    ssl_certificate_key /etc/vse/registry/tls/registry.key;

    client_max_body_size 0; # OCI blobs may be large

    location /v2/ {
        auth_basic "vse-private-registry";
        auth_basic_user_file /etc/vse/registry/auth/htpasswd;

        proxy_pass http://${REGISTRY_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900;
    }
}
