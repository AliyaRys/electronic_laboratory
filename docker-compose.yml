# Base Compose stack (ADR-013): no `version:`, no bind mounts, no reload.
# PostgreSQL and backend are NOT published here; only the frontend nginx exposes
# the single origin on the host loopback. Run development with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  postgres:
    image: postgres:18.6@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-vse}
    command:
      - postgres
      - -c
      - synchronous_commit=local
      - -c
      - synchronous_standby_names=vse_backup
      - -c
      - max_slot_wal_keep_size=20GB
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    volumes:
      # PostgreSQL 18+ stores clusters below a major-version directory.
      # Mount the parent so startup and future pg_upgrade --link are valid.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-vse}"]
      interval: 5s
      timeout: 5s
      retries: 12
    expose:
      - "5432"
    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine3.23@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    expose:
      - "6379"
    restart: unless-stopped

  # O02: app-side reverse tunnel. It is opt-in and has no host port. The
  # backup host sees only 127.0.0.1:6543; the key is restricted server-side
  # to permitlisten="127.0.0.1:6543" and cannot open a shell.
  backup-tunnel:
    image: ${BACKUP_TUNNEL_IMAGE:-vse-backup-tunnel:local}
    build:
      context: deploy/backup
      dockerfile: tunnel.Dockerfile
    profiles: ["backup"]
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    secrets:
      - vse_backup_tunnel_key
      - vse_backup_known_hosts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    # Digest-deployable: an installation sets BACKEND_IMAGE (and
    # FRONTEND_IMAGE) to the release manifest digest ref, e.g.
    #   BACKEND_IMAGE=<registry>/<ns>/vse-backend@sha256:<digest>
    # The default tag is used only for local/dev builds from source.
    image: ${BACKEND_IMAGE:-vse-backend:local}
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-vse}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      REPORT_PREVIEW_KEYS: ${REPORT_PREVIEW_KEYS:?REPORT_PREVIEW_KEYS is required}
      # O02 enables this only after provisioning and proving a synchronous WAL receiver.
      DELETE_DURABILITY_ENABLED: ${DELETE_DURABILITY_ENABLED:-false}
      BACKUP_READINESS_PATH: /run/secrets/backup_readiness
      BACKUP_REPLICATION_APPLICATION_NAME: vse_backup
      BACKUP_REPLICATION_SLOT: vse_backup
    secrets:
      - backup_readiness
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "8000"
    restart: unless-stopped

  # One-shot migration service, run before the new API version (ADR-003):
  #   docker compose --profile migrate run --rm migrate
  migrate:
    image: ${BACKEND_IMAGE:-vse-backend:local}
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    profiles: ["migrate"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-vse}
    command:
      [
        "python",
        "deploy/migrate_lock.py",
        "python",
        "-m",
        "alembic",
        "-c",
        "backend/alembic.ini",
        "upgrade",
        "head",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-vse-frontend:local}
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:

secrets:
  backup_readiness:
    file: ${BACKUP_READINESS_FILE:-deploy/backup/not-ready.json}
  vse_backup_tunnel_key:
    file: ${BACKUP_TUNNEL_KEY_FILE:-deploy/backup/not-configured-key}
  vse_backup_known_hosts:
    file: ${BACKUP_KNOWN_HOSTS_FILE:-deploy/backup/not-configured-known-hosts}
