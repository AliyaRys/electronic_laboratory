# Base Compose stack (ADR-013): no `version:`, no bind mounts, no reload.
# PostgreSQL and backend are NOT published here; only the frontend nginx exposes
# the single origin on the host loopback. Run development with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  postgres:
    image: postgres:18.6@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-vse}
    volumes:
      # PostgreSQL 18+ stores clusters below a major-version directory.
      # Mount the parent so startup and future pg_upgrade --link are valid.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-vse}"]
      interval: 5s
      timeout: 5s
      retries: 12
    expose:
      - "5432"
    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine3.23@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    expose:
      - "6379"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-vse}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      REPORT_PREVIEW_KEYS: ${REPORT_PREVIEW_KEYS:?REPORT_PREVIEW_KEYS is required}
      # O02 enables this only after provisioning and proving a synchronous WAL receiver.
      DELETE_DURABILITY_ENABLED: ${DELETE_DURABILITY_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "8000"
    restart: unless-stopped

  # One-shot migration service, run before the new API version (ADR-003):
  #   docker compose --profile migrate run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    profiles: ["migrate"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-vse}
    command:
      [
        "python",
        "deploy/migrate_lock.py",
        "python",
        "-m",
        "alembic",
        "-c",
        "backend/alembic.ini",
        "upgrade",
        "head",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
